# 三平台构建 + 单元测试；e2e 只在 Linux 上跑。
#
# 工具链是**各平台官方的那一套**：Qt 用官方二进制（install-qt-action / aqtinstall），
# 编译器用 runner 自带的（gcc / clang / MSVC）。
#
# 原来这里走的是 conda-forge（micromamba + qt6-main + cxx-compiler），图的是
# 三平台一个 Qt 版本、和开发机对得上。代价比收益大得多，实际付过的账：
#
#   - conda Qt 是 MSVC 编的，而 runner 预装了 MinGW gcc，CMake 先摸到后者 →
#     满屏 `undefined reference to __imp__ZNK9QIODevice`；
#   - `micromamba-shell` 只在 macOS / Linux 上有，Windows 得另写一套，而
#     `shell:` 这个键又不吃 matrix 上下文，步骤只能按平台硬拆；
#   - 自定义 shell 不会被注入 `set -e`，打包脚本失败过一次而 job still green；
#   - conda 的 GCC 15 编出来的 Qt 要 `CXXABI_1.3.15`，AppImage 拿到
#     Ubuntu 22.04 上直接起不来（首次发版试跑时才撞上）；
#   - conda-forge 的 Qt 还动态链着 zlib / pcre2 / zstd / brotli / freetype，
#     Windows 打包得自己把它们捞出来（官方 Qt 二进制自带）。
#
# conda 仍然是**本机开发**的参考环境（见 CLAUDE.md），只是不该出现在 CI 上。
# 发行版自带 Qt 6.2 那条路由 distro-qt 这个 job 兜住 —— 源码必须能用它编过。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 无界面构建 / 运行都不需要显示器，Qt 自带的 offscreen 插件就够。
  QT_QPA_PLATFORM: offscreen
  # 官方 Qt 的版本。发版工作流里钉的是同一个，改要一起改。
  QT_VERSION: '6.8.*'

jobs:
  build:
    name: 构建与单测 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `shell:` 不吃 matrix 上下文（Actions 会整份拒绝解析），但 `run:` 吃，
        # 所以平台差异一律通过 run 里的矩阵变量表达，不要再按平台拆步骤。
        include:
          - os: ubuntu-latest
            cmake_extra: ""
          - os: windows-latest
            cmake_extra: "-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl"
          # **钉 macos-14，不要用 macos-latest。** Qt 6.8 LTS 的官方 macOS 二进制
          # 是用还带 AGL 框架的 SDK 构建的，它的 CMake 配置里因此留着
          # `-framework AGL`；而 macos-latest 现在是 Xcode 16（SDK 15），AGL 已被
          # 删除，链接期直接 `ld: framework 'AGL' not found`。AGL 是早就废弃的老
          # OpenGL 胶水，本项目一行都不用，纯粹是 Qt 预编译包带出来的。
          # 发版的 macOS job 本来就钉 macos-14（要 Apple Silicon），两边保持一致。
          # 等 macos-14 下线时，把 QT_VERSION 抬到 6.9+（那批是用 Xcode 16 构建的）。
          - os: macos-14
            cmake_extra: ""

    steps:
      - uses: actions/checkout@v4
        with:
          # cmake/Version.cmake 靠 git describe 取版本号，浅克隆会拿不到 tag。
          fetch-depth: 0

      - name: 装 Qt（官方二进制）
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: 装 Ninja
        shell: bash
        run: |
          set -euo pipefail
          if command -v ninja >/dev/null 2>&1; then ninja --version; exit 0; fi
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y ninja-build ;;
            macOS)   brew install ninja ;;
            Windows) choco install ninja -y ;;
          esac

      # Windows 上要显式进 MSVC 环境。不这么做的话 CMake 会在 PATH 上先摸到
      # runner 预装的 C:\mingw64\bin\gcc，拿 MinGW 去链 MSVC 编的 Qt ——
      # 症状是满屏 `undefined reference to __imp__ZNK9QIODevice...`，看着像缺库，
      # 其实是编译器选错了。vswhere + Enter-VsDevShell 把环境变量写进 GITHUB_ENV，
      # 后面的步骤（包括 bash）就都在 MSVC 环境里了，不用再按平台拆步骤。
      - name: 进 MSVC 环境（仅 Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
                  -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=x64"
          # 只传 DevShell 真正改动的那几个，不要把整个 env 倒进 $GITHUB_ENV ——
          # 里面任何一个带换行的值都会把 KEY=VALUE 这个格式冲掉。
          foreach ($name in 'PATH','INCLUDE','LIB','LIBPATH') {
              $value = [Environment]::GetEnvironmentVariable($name)
              if ($value) { "$name=$value" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append }
          }

      - name: 构建与单测
        shell: bash
        run: |
          set -euo pipefail
          # 编译器显式钉死：PATH 顺序变了也不会悄悄换回 gcc。
          cmake --preset ci ${{ matrix.cmake_extra }}
          cmake --build --preset ci
          ctest --preset ci

      - name: 冒烟
        shell: bash
        run: |
          set -euo pipefail
          # 三个平台三种落点：
          #   Linux    bin/onvifsim
          #   macOS    bin/onvifsim.app/Contents/MacOS/onvifsim   （MACOSX_BUNDLE）
          #   Windows  bin/onvifsim-cli.exe  （GUI 子系统的 exe 在命令行拿不到控制台）
          #
          # 这一步原来只写了第一种，macOS 上其实一直在报 "No such file or directory"
          # —— 但当时用的是 micromamba-shell，自定义 shell 不会被注入 `set -e`，
          # 于是整个步骤照样绿。换成 shell: bash 之后当场暴露。
          for candidate in build/ci/bin/onvifsim \
                           build/ci/bin/onvifsim.app/Contents/MacOS/onvifsim \
                           build/ci/bin/onvifsim-cli.exe; do
            if [ -x "${candidate}" ]; then exe="${candidate}"; break; fi
          done
          if [ -z "${exe:-}" ]; then
            echo "::error::build/ci/bin 下找不到可执行文件"; ls -R build/ci/bin; exit 1
          fi
          echo "跑的是 ${exe}"
          "${exe}" --version
          "${exe}" --list-presets
          "${exe}" --list-scenarios
          "${exe}" --list-quirks | tail -n 1

      - name: 上传构建产物（失败时便于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os }}
          path: |
            build/ci/CMakeCache.txt
            build/ci/Testing/**
          if-no-files-found: ignore

  distro-qt:
    # 硬性约束：源码必须能用 Qt 6.2 / CMake 3.21 / C++17 编过。
    # Ubuntu 22.04 自带的正是 Qt 6.2，这个 job 就是那条底线的看门人。
    name: 发行版 Qt 6.2 (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 装系统 Qt6 与构建工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools \
            libgl1-mesa-dev

      - name: 配置（不带 GUI 也过一遍，容器镜像走的就是这条）
        run: |
          cmake -S . -B build/distro -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_WERROR=ON
          cmake -S . -B build/distro-headless -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_WERROR=ON -DBUILD_GUI=OFF

      - name: 构建
        run: |
          cmake --build build/distro
          cmake --build build/distro-headless

      - name: 单元测试
        run: ctest --test-dir build/distro --output-on-failure

  e2e:
    name: 端到端 (Linux)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 装 ffmpeg（要的是 ffprobe）与 Qt offscreen 插件的运行期依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libgl1 libegl1 libxkbcommon0 libdbus-1-3
          ffprobe -version | head -n 1

      - name: 装 Qt（官方二进制）
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: 装 Ninja
        run: sudo apt-get install -y ninja-build

      - name: 构建
        run: |
          cmake --preset ci
          cmake --build --preset ci

      - name: 生成 docs/quirks.md 并检查是否与代码同源
        run: |
          ONVIFSIM_BINARY=./build/ci/bin/onvifsim ./scripts/gen-docs.sh
          if git ls-files --error-unmatch docs/quirks.md >/dev/null 2>&1; then
            git diff --exit-code -- docs/quirks.md \
              || { echo "::error::docs/quirks.md 与 Quirks 表不一致，跑 scripts/gen-docs.sh 后提交"; exit 1; }
          else
            echo "docs/quirks.md 还没入库，本次只生成不校验"
          fi

      - name: 装 e2e 依赖
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip install
        working-directory: tests/e2e
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 跑 e2e（不含多播）
        working-directory: tests/e2e
        env:
          ONVIFSIM_BINARY: ${{ github.workspace }}/build/ci/bin/onvifsim
        run: pytest -m "not discovery" --durations=15

      - name: 跑 e2e 的多播用例（跑不通不阻塞）
        working-directory: tests/e2e
        continue-on-error: true
        env:
          ONVIFSIM_BINARY: ${{ github.workspace }}/build/ci/bin/onvifsim
        run: pytest -m discovery --durations=10

      - name: 上传 e2e 失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/pytest-of-runner/**/onvifsim.*.log
          if-no-files-found: ignore

  docker:
    name: 容器镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建 headless 镜像
        run: docker build -f packaging/docker/Dockerfile -t onvifsim:ci .

      - name: 冒烟
        run: docker run --rm onvifsim:ci --version
