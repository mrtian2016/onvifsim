# 打 tag 就出三平台产物并挂到 GitHub Release 上。
#
#   git tag -a v0.1.0 -m "0.1.0" && git push origin v0.1.0
#
# 产物：
#   Linux    AppImage（自带 Qt，下载即跑）+ deb（Debian/Ubuntu）+ tar.gz（靠系统 Qt）
#   Windows  免安装 zip（windeployqt 收齐运行时）
#   macOS    dmg（macdeployqt + ad-hoc 签名，无开发者账号也能跑）
#   容器     ghcr.io 上的 headless 镜像

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要打包的 tag（手工触发时用）'
        required: false

permissions:
  contents: write
  packages: write

jobs:
  linux:
    name: Linux 产物
    runs-on: ubuntu-22.04    # 用老一点的 glibc，产物能在更多发行版上跑
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 装工具链（micromamba）
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: onvifsim-release
          create-args: >-
            qt6-main
            cmake
            ninja
            cxx-compiler
          init-shell: bash

      - name: AppImage 工具的运行期依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            file fuse libfuse2 desktop-file-utils patchelf zsync \
            libegl1 libgl1 libxkbcommon-x11-0
          # libegl1 / libgl1 不是给我们自己用的，是 linuxdeploy-plugin-qt 解
          # Qt 依赖时要读的 —— 缺了它直接
          # `DependencyNotFoundError: Could not find dependency: libEGL.so.1`，
          # 而且（见下）那个失败原来还会被咽掉。

      - name: 构建
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          cmake --preset release
          cmake --build --preset release

      # tar.gz **不在这儿打**：这个 job 用的是 conda 的 Qt 6.11，而 tar.gz 宣称
      # 靠系统 Qt。v0.1.0 就是在这儿打的，结果 rpath 指着 runner 的 micromamba
      # 目录、还要求 Qt_6.11 符号，装到任何发行版上都起不来。它现在归 linux-deb
      # 那个用发行版 Qt 的 job 打，make-tarball.sh 里也补了拒绝 conda 构建的守卫。
      - name: 打 AppImage
        shell: micromamba-shell {0}
        run: |
          # **必须自己 set -e**：micromamba-shell 是自定义 shell，GitHub 不会像对
          # 内置 bash 那样注入 `set -e`。少了这行，make-appimage.sh 失败之后
          # 后面照跑、这一步还报成功，最后发出去一个少了 AppImage 的 Release。
          # 真踩过（v0.1.0-rc1 那次）。
          set -euo pipefail
          ./packaging/linux/make-appimage.sh build/release dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  linux-deb:
    name: Linux 产物 (deb)
    # deb 必须用**发行版的 Qt** 构建，不能用 conda 的那份：包的 Depends 是从
    # 二进制实际链接的 .so 反推出来的。22.04 的 Qt 6.2 正好是本项目的下限，
    # 打出来的包在 22.04 及以后都装得上。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 装发行版 Qt6 与打包工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            libgl1-mesa-dev \
            cmake ninja-build g++ dpkg-dev fakeroot lintian \
            qt6-qpa-plugins
          # qt6-qpa-plugins 是给**打包脚本里的冒烟**用的：它在封包前会跑一遍
          # `--headless`，那一步要加载 offscreen 平台插件。装 deb 的时候它会作为
          # 依赖被带进来，但冒烟发生在那之前。

      - name: 构建（系统 Qt）
        run: |
          cmake -S . -B build/deb -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build/deb

      - name: 打 deb
        run: ./packaging/linux/make-deb.sh build/deb dist

      # tar.gz 和 deb 一样靠系统 Qt，所以跟着这个 job 走。
      - name: 打 tar.gz
        run: ./packaging/linux/make-tarball.sh build/deb dist

      - name: 装一遍再卸一遍，确认包是好的
        run: |
          sudo apt-get install -y ./dist/onvifsim_*.deb
          onvifsim --version
          onvifsim --list-quirks > /dev/null
          # 无界面模式没有「跑多久就退出」的开关，靠 timeout 掐；124 是被掐掉，
          # 说明它确实起来了并且一直在跑，这就是要验的东西。
          timeout 5 onvifsim --headless --cameras 1 --control-port 9099 \
            || [ $? -eq 124 ]
          sudo apt-get remove -y onvifsim

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*

  windows:
    name: Windows 产物
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 装工具链（micromamba）
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: onvifsim-release
          create-args: >-
            qt6-main
            cmake
            ninja
            cxx-compiler
          # micromamba 的 micromamba-shell 只在 macOS / Linux 上有，Windows 必须走
          # powershell —— conda 的 MSVC 激活脚本是 .bat，本来也只有它跑得了。
          init-shell: powershell

      # 同 ci.yml：不进 MSVC 环境的话 CMake 会摸到 runner 预装的 MinGW gcc，
      # 拿它去链 MSVC 编的 conda Qt，满屏 undefined reference。
      - name: 构建
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
                  -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=x64"
          micromamba activate onvifsim-release
          cmake --preset release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          cmake --build --preset release

      - name: 装 Inno Setup（做引导式安装包用）
        run: winget install --id JRSoftware.InnoSetup -e --accept-package-agreements --accept-source-agreements
        shell: pwsh
        continue-on-error: true   # winget 在 runner 上偶尔抽风，装不上就只出 zip

      - name: 打免安装 zip 与安装包
        shell: pwsh
        run: |
          micromamba activate onvifsim-release
          # 有安装包就出安装包，Inno Setup 没装上就退回只出免安装 zip。
          try {
              & packaging\windows\make-installer.ps1 -BuildDir build\release -OutputDir dist
          } catch {
              Write-Host "安装包没做成（$_），退回免安装 zip"
              & packaging\windows\make-portable.ps1 -BuildDir build\release -OutputDir dist
          }

      - name: 清掉打包用的中间目录（只留 zip 与 setup.exe）
        shell: bash
        run: rm -rf dist/onvifsim-*-windows-x64/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    name: macOS 产物 (arm64)
    # 显式钉 macos-14：它是 Apple Silicon 的 runner。用 macos-latest 的话，
    # GitHub 换默认镜像时架构会跟着变，产物名与实际架构就对不上了。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 装工具链（micromamba）
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: onvifsim-release
          create-args: >-
            qt6-main
            cmake
            ninja
            cxx-compiler
          init-shell: bash

      - name: 构建
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          cmake --preset release
          cmake --build --preset release

      - name: 打 dmg（ad-hoc 签名）
        shell: micromamba-shell {0}
        run: ./packaging/macos/make-dmg.sh build/release dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  docker:
    name: 容器镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [linux, linux-deb, windows, macos]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          # **按名字挑**，不要无差别全收：docker/build-push-action 会自己额外传一个
          # `<owner>~<repo>~XXXX.dockerbuild` 的产物，体积是 0，
          # download-artifact 下到它就直接 `Artifact download failed after 5 retries`
          # 整步挂掉（踩过）。顺带也保证不会有多余文件混进 Release 的附件列表。
          pattern: "{linux,linux-deb,windows,macos}"
          merge-multiple: true

      - name: 列一下产物
        run: ls -lh dist

      - name: 核对产物清单
        run: |
          set -euo pipefail
          # 六个产物一个都不能少。
          #
          # 这一步存在的理由：打包脚本失败过一次却没让 job 变红（自定义 shell
          # 不会自动 set -e），差点发出去一个没有 AppImage 的 Release。
          # 逐条按模式点名，比「有文件就发」可靠得多 —— 少了哪个，
          # 这里当场报出来是哪个，而不是等用户在 Release 页面上发现。
          expected=(
            "*.AppImage"
            "*_amd64.deb"
            "*-linux-x86_64.tar.gz"
            "*-windows-x64.zip"
            "*-windows-x64-setup.exe"
            "*-macos-*.dmg"
          )
          missing=0
          for pattern in "${expected[@]}"; do
            # shellcheck disable=SC2086
            if compgen -G "dist/$pattern" > /dev/null; then
              printf '  有  %s\n' "$(cd dist && compgen -G "$pattern" | tr '\n' ' ')"
            else
              printf '  缺  %s\n' "$pattern"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "产物不全，不发布。上面标「缺」的那几个去对应的 job 里看日志。" >&2
            exit 1
          fi

      - name: 生成校验和
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt

      - name: 从 CHANGELOG 抽出这个版本的段落
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # 预发布 tag（0.1.0-rc3）在 CHANGELOG 里没有自己的段落，退回基础版本
          # 0.1.0 的那一段 —— 否则用 rc 试跑时永远验不到「发布说明取得对不对」，
          # 而那正是试跑要验的东西之一。
          base="${version%%-*}"
          : > release-notes.md
          for candidate in "$version" "$base"; do
            if [ -f CHANGELOG.md ]; then
              awk -v v="$candidate" '
                /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
                found { print }
              ' CHANGELOG.md > release-notes.md
            fi
            [ -s release-notes.md ] && break
          done
          if [ ! -s release-notes.md ]; then
            echo "本次发布的变更见 CHANGELOG.md。" > release-notes.md
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          fail_on_unmatched_files: true
